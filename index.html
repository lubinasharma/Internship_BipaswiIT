<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample Site</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* Header */
        header {
            padding: 20px 0;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            font-family: 'Montserrat', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: white;
            text-decoration: none;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 100px 0;
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
            animation: fadeInUp 1s ease-out;
        }

        .hero p {
            font-size: 1.2rem;
            opacity: 0.9;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        /* Welcome Section */
        .welcome {
            text-align: center;
            padding: 60px 0;
        }

        .sticker {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            padding: 40px 60px;
            margin: 20px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            animation: bounce 2s infinite;
        }

        .sticker-emoji {
            font-size: 4rem;
            margin-bottom: 15px;
            display: block;
        }

        .sticker-text {
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        /* Footer */
        footer {
            background: rgba(0, 0, 0, 0.3);
            text-align: center;
            padding: 30px 0;
            margin-top: 80px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        footer p {
            font-size: 1rem;
            opacity: 0.8;
            font-weight: 300;
        }

        /* Animations */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 2.5rem;
            }
            
            .logo {
                font-size: 1.5rem;
            }
            
            .sticker {
                padding: 30px 40px;
                margin: 10px;
            }
            
            .sticker-emoji {
                font-size: 3rem;
            }
            
            .sticker-text {
                font-size: 1.2rem;
            }
        }

        /* Decorative elements */
        .hero::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="20" cy="20" r="2" fill="rgba(255,255,255,0.1)"/><circle cx="80" cy="40" r="1.5" fill="rgba(255,255,255,0.1)"/><circle cx="40" cy="80" r="1" fill="rgba(255,255,255,0.1)"/><circle cx="90" cy="90" r="2.5" fill="rgba(255,255,255,0.1)"/><circle cx="10" cy="60" r="1.2" fill="rgba(255,255,255,0.1)"/></svg>');
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="#" class="logo">Sample Site</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Your Site is Live Now!</h1>
                <p>Welcome to your beautiful new website</p>
            </div>
        </section>

        <section class="welcome">
            <div class="container">
                <div class="sticker">
                    <span class="sticker-emoji">🎉</span>
                    <div class="sticker-text">Welcome!</div>
                </div>
                <div class="sticker">
                    <span class="sticker-emoji">✨</span>
                    <div class="sticker-text">You're Here!</div>
                </div>
                <div class="sticker">
                    <span class="sticker-emoji">🚀</span>
                    <div class="sticker-text">Let's Go!</div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Created in 2025</p>
        </div>
    </footer>
</body>
</html>
